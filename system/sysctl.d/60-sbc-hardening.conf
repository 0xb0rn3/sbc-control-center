# SBC Control Center: kernel settings that need no rebuild
kernel.kptr_restrict = 2            # hide kernel addresses, even from root tools
kernel.dmesg_restrict = 1           # kernel log readable by root only
kernel.yama.ptrace_scope = 1        # a process may only debug its own children
net.netfilter.nf_conntrack_acct = 1 # byte and packet counts per connection (threat map, flows)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.tcp_syncookies = 1
