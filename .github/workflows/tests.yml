name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Package source archive
        run: |
          git archive --format=zip --prefix=sbc-control-center/ HEAD -o /tmp/sbc-control-center-feature-network-observability.zip
          sha256sum /tmp/sbc-control-center-feature-network-observability.zip > /tmp/sbc-control-center-feature-network-observability.zip.sha256
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: sbc-control-center-feature-network-observability
          path: |
            /tmp/sbc-control-center-feature-network-observability.zip
            /tmp/sbc-control-center-feature-network-observability.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Check inline frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline frontend scripts found.")
          Path("/tmp/sbc-control-center-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/sbc-control-center-inline.js
