<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TV · __SBC_DEVICE_LABEL__</title>
<link rel="stylesheet" href="/assets/ui/tv.css">
<script src="/assets/vendor/hls.min.js"></script>
<script src="/assets/ui/tv.js" defer></script>
</head>
<body>
<header class="tv-top">
  <div class="tv-bar">
    <div class="tv-brand"><span class="tv-logo" aria-hidden="true"></span>YouTube<small>no ads · through your VPN</small></div>
    <form id="searchForm" class="tv-search" autocomplete="off">
      <input id="q" type="search" placeholder="Search YouTube" data-nav aria-label="Search YouTube">
      <button type="submit" data-nav>Search</button>
    </form>
  </div>
  <nav class="tv-tabs" aria-label="Sections">
    <button type="button" id="homeBtn" data-nav class="on">Home</button>
    <button type="button" id="recBtn" data-nav hidden>Recommended</button>
    <button type="button" id="historyBtn" data-nav>History</button>
    <button type="button" id="laterBtn" data-nav>Watch Later</button>
  </nav>
</header>
<main>
  <p id="status" class="tv-status" aria-live="polite">Loading…</p>
  <div id="rows" class="tv-rows"></div>
  <section id="list" class="tv-list" hidden>
    <h2 id="rowTitle"></h2>
    <div id="grid" class="tv-grid"></div>
  </section>
</main>
<div id="player" class="tv-player" hidden>
  <video id="video" playsinline></video>
  <div id="info" class="tv-info">
    <h3 id="vTitle"></h3>
    <p id="vChannel"></p>
    <div class="tv-info-actions">
      <button type="button" id="subBtn" data-pnav>Subscribe</button>
      <button type="button" id="channelBtn" data-pnav>Channel</button>
      <button type="button" id="laterAdd" data-pnav>Watch Later</button>
      <select id="qSel" data-pnav aria-label="Quality"><option value="-1">Auto quality</option></select>
      <select id="speedSel" data-pnav aria-label="Speed"><option value="0.75">0.75×</option><option value="1" selected>1× speed</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <select id="ccSel" data-pnav aria-label="Subtitles"><option value="">Subtitles off</option></select>
      <select id="chapSel" data-pnav aria-label="Chapters" hidden></select>
      <button type="button" id="closeBtn" data-pnav>Back</button>
    </div>
    <p class="tv-keys">OK: pause or play · ◀ ▶: 10 seconds · Back: close</p>
  </div>
</div>
</body>
</html>
